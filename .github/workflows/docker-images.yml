name: Docker Images CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: docker-images-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: Prepare common data for images
    runs-on: ubuntu-latest
    env: 
      TZ: Europe/Moscow
    outputs:
      images_tag: ${{ steps.images_data.outputs.tag }}
    steps:
      - name: Save common images data
        id: images_data
        run: echo "tag=$(date +%y.%m.%d_%H-%M-%S)" >> "$GITHUB_OUTPUT"

  build_push_scheduler:
    name: Build scheduler image and push it to Docker Hub
    runs-on: ubuntu-latest
    needs: common
    env: 
      TZ: Europe/Moscow
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_RW_ACCESS_USER }}
          password: ${{ secrets.DOCKER_HUB_RW_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/scheduler/Dockerfile
          push: true
          cache-from: type=gha,scope=build-cache-scope-${{ github.ref }}
          cache-to: type=gha,scope=build-cache-scope-${{ github.ref }},mode=max
          tags: >
                ${{ vars.DOCKER_HUB_SCHEDULER_REPO }}:latest,
                ${{ vars.DOCKER_HUB_SCHEDULER_REPO }}:${{needs.common.outputs.images_tag}}

  build_push_worker:
    name: Build worker image and push it to Docker Hub
    runs-on: ubuntu-latest
    needs: common
    env: 
      TZ: Europe/Moscow
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_RW_ACCESS_USER }}
          password: ${{ secrets.DOCKER_HUB_RW_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/worker/Dockerfile
          push: true
          cache-from: type=gha,scope=build-cache-scope-${{ github.ref }}
          cache-to: type=gha,scope=build-cache-scope-${{ github.ref }},mode=max
          tags: >
                ${{ vars.DOCKER_HUB_WORKER_REPO }}:latest,
                ${{ vars.DOCKER_HUB_WORKER_REPO }}:${{needs.common.outputs.images_tag}}
