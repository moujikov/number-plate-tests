                ${{ vars.DOCKER_HUB_PROCESSOR_REPO }}:latest,
                ${{ vars.DOCKER_HUB_PROCESSOR_REPO }}:${{needs.common.outputs.version}},
                ${{ vars.DOCKER_HUB_PROCESSOR_REPO }}:${{needs.common.outputs.build}}

  build_push_scheduler:
    name: Build scheduler image and push it to Docker Hub
    runs-on: ubuntu-latest
    needs: common
    env: 
      TZ: Europe/Moscow
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_RW_ACCESS_USER }}
