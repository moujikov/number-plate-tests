                ${{ vars.DOCKER_HUB_SCHEDULER_REPO }}:${{needs.common.outputs.version}},
                ${{ vars.DOCKER_HUB_SCHEDULER_REPO }}:${{needs.common.outputs.build}}

  build_push_worker:
    name: Build worker image and push it to Docker Hub
    runs-on: ubuntu-latest
    needs: common
