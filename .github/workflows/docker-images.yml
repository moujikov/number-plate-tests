name: Docker Images CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: docker-images-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: Prepare common data for images
    runs-on: ubuntu-latest
    env: 
      TZ: Europe/Moscow
    outputs:
      version: ${{ steps.images_data.outputs.version }}
      build: ${{ steps.images_data.outputs.build }}
    steps:
      - name: Checkout repository and fetch tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # This fetches the entire history and all tags
      - name: Save common images data
        id: images_data
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
            version=$(git describe --tags --abbrev=0 | sed 's/^v//')    # removing leading 'v'
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "build=$version-build.$BUILD_NUMBER" >> "$GITHUB_OUTPUT"


  build_push_ftp:
    name: Build FTP server image and push it to Docker Hub
    runs-on: ubuntu-latest
    needs: common
    env: 
      TZ: Europe/Moscow
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_RW_ACCESS_USER }}
          password: ${{ secrets.DOCKER_HUB_RW_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/ftp/Dockerfile
          push: true
          cache-from: type=gha,scope=build-cache-scope-${{ github.ref }}
          cache-to: type=gha,scope=build-cache-scope-${{ github.ref }},mode=max
          tags: >
                ${{ vars.DOCKER_HUB_FTP_REPO }}:latest,
                ${{ vars.DOCKER_HUB_FTP_REPO }}:${{needs.common.outputs.version}},
                ${{ vars.DOCKER_HUB_FTP_REPO }}:${{needs.common.outputs.build}}

  build_push_primeskud_web:
    name: Build primeskud.web image and push it to Docker Hub
    runs-on: ubuntu-latest
    needs: common
    env: 
      TZ: Europe/Moscow
    steps:
