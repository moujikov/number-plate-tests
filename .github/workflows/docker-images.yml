    runs-on: ubuntu-latest
    needs: common
    env: 
      TZ: Europe/Moscow
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_RW_ACCESS_USER }}
          password: ${{ secrets.DOCKER_HUB_RW_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/processor/Dockerfile
          push: true
          cache-from: type=gha,scope=build-cache-scope-${{ github.ref }}
          cache-to: type=gha,scope=build-cache-scope-${{ github.ref }},mode=max
