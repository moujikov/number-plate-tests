      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_RW_ACCESS_USER }}
          password: ${{ secrets.DOCKER_HUB_RW_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/primeskud.web/Dockerfile
          push: true
          cache-from: type=gha,scope=build-cache-scope-${{ github.ref }}
          cache-to: type=gha,scope=build-cache-scope-${{ github.ref }},mode=max
          tags: >
                ${{ vars.DOCKER_HUB_PRIMESKUD_WEB_REPO }}:latest,
                ${{ vars.DOCKER_HUB_PRIMESKUD_WEB_REPO }}:${{needs.common.outputs.version}},
                ${{ vars.DOCKER_HUB_PRIMESKUD_WEB_REPO }}:${{needs.common.outputs.build}}

  build_push_processor:
