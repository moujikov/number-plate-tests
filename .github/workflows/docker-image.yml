name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

concurrency:
  group: docker-image-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    env: 
      TZ: Europe/Moscow
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_RW_ACCESS_USER }}
          password: ${{ secrets.DOCKER_HUB_RW_ACCESS_TOKEN }}

      - name: Calculate image tag
        run: echo "TAG=$(date +%y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha,scope=build-cache-scope-${{ github.ref }}
          cache-to: type=gha,scope=build-cache-scope-${{ github.ref }},mode=max
          tags: ${{ vars.DOCKER_HUB_REPO }}:latest, ${{ vars.DOCKER_HUB_REPO }}:${{ env.TAG }}
