name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjpeg-turbo-official
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -vv --junit-xml=test-results.xml

      - name: Surface failing tests
        uses: pmeier/pytest-results-action@main
        if: always()
        with:
          path: test-results.xml
          display-options: fsEX   # Show failed, skipped, error and xPassed
          fail-on-empty: true     # Fail if test-results.xml not found.
          title: Test results
