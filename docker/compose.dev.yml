services:

  scheduler:
    container_name: scheduler
    image: moujikov/number-plates-scheduler
    restart: unless-stopped
    ports:
      - 8000:8000/tcp
    volumes:
      - ..:/app
    env_file: .env.scheduler
    environment:
      MODE: development
      WORKER_URL_1: http://worker-1:8000
      WORKER_URL_2: http://worker-2:8000
      WORKER_URL_3: http://worker-3:8000
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      worker-3:
        condition: service_healthy

  worker-1:
    container_name: worker-1
    image: moujikov/number-plates-worker
    restart: unless-stopped
    expose:
      - 8000/tcp
    volumes:
      - ..:/app
    env_file: .env.worker
    environment:
      MODE: development


  worker-2:
    container_name: worker-2
    image: moujikov/number-plates-worker
    restart: unless-stopped
    expose:
      - 8000/tcp
    volumes:
      - ..:/app
    env_file: .env.worker
    environment:
      MODE: development


  worker-3:
    container_name: worker-3
    image: moujikov/number-plates-worker
    restart: unless-stopped
    expose:
      - 8000/tcp
    volumes:
      - ..:/app
    env_file: .env.worker
    environment:
      MODE: development
