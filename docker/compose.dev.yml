name: number-plates

services:
  ftp-server:
    container_name: ftp-server
    image: moujikov/number-plates-ftp
    restart: unless-stopped
    ports:
      - 21:21/tcp
      - 30001-30005:30001-30005/tcp
    volumes:
      - ./ftp/proftpd.conf:/etc/proftpd/proftpd.conf
      - ./ftp/entrypoint.sh:/entrypoint.sh
      - cameras:/home
      - logs_ftp-server:/var/log/proftpd
    env_file: ftp/.env
    environment:
      - PASSIVE_PORTS=30001-30005
      - FTP_USER_1=camera-1
      - FTP_PASSWORD_1=pass1
      - FTP_USER_2=camera-2
      - FTP_PASSWORD_2=pass2

  database:
    container_name: database
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: database/.env
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 1G

  scheduler:
    container_name: scheduler
    image: moujikov/number-plates-scheduler
    restart: unless-stopped
    ports:
      - 8000:8000/tcp
    volumes:
      - ..:/app
    env_file: scheduler/.env
    environment:
      MODE: development
      WORKER_URL_1: http://worker-1:8000
      WORKER_URL_2: http://worker-2:8000
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy

  worker-1:
    container_name: worker-1
    image: moujikov/number-plates-worker
    restart: unless-stopped
    volumes:
      - ..:/app
    env_file: worker/.env
    environment:
      MODE: development

  worker-2:
    container_name: worker-2
    image: moujikov/number-plates-worker
    restart: unless-stopped
    volumes:
      - ..:/app
    env_file: worker/.env
    environment:
      MODE: development

volumes:
  database:
  cameras:
  logs_ftp-server:
