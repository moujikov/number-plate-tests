services:

  scheduler:
    container_name: scheduler
    image: moujikov/number-plates-scheduler
    restart: unless-stopped
    ports:
      - 8000:8000/tcp
    # volumes:
      # - /var/log/number-plates:/var/log/number-plates-scheduler
    environment:
      TZ: ${TZ}
      # ACCESS_TOKEN: "${SCHEDULER_ACCESS_TOKEN}"
      WORKER_URL_1: http://worker-1:8000
      WORKER_URL_2: http://worker-2:8000
      WORKER_URL_3: http://worker-3:8000
      WORKER_URL_4: http://worker-4:8000
    depends_on:
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      worker-3:
        condition: service_healthy
      worker-4:
        condition: service_healthy

  worker-1:
    container_name: worker-1
    image: moujikov/number-plates-worker
    restart: unless-stopped
    expose:
      - 8000/tcp
    environment:
      TZ: ${TZ}

  worker-2:
    container_name: worker-2
    image: moujikov/number-plates-worker
    restart: unless-stopped
    expose:
      - 8000/tcp
    environment:
      TZ: ${TZ}
  
  worker-3:
    container_name: worker-3
    image: moujikov/number-plates-worker
    restart: unless-stopped
    expose:
      - 8000/tcp
    environment:
      TZ: ${TZ}
      
  worker-4:
    container_name: worker-4
    image: moujikov/number-plates-worker
    restart: unless-stopped
    expose:
      - 8000/tcp
    environment:
      TZ: ${TZ}
